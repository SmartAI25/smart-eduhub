<!DOCTYPE html><html><head><meta charset="UTF-8"><title>BPSC (Bihar PCS) CBT</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-950 text-white min-h-screen p-3 sm:p-5 flex flex-col justify-between select-none">
  <header class="flex justify-between items-center border-b border-slate-800 pb-2 text-xs">
    <div class="flex items-center space-x-3"><a href="index.html" class="text-rose-400 font-bold">✕ Exit</a><span>|</span><span class="font-bold">BPSC (Bihar PCS)</span><span>|</span><span class="text-amber-400 font-mono">+1.00 / -0.33</span></div>
    <div class="flex items-center space-x-3">
      <select id="lang" onchange="chLang(this.value)" class="bg-slate-900 border border-slate-700 text-white rounded px-2 py-1 text-xs">
        <option value="hi" selected>हिन्दी</option><option value="en">English</option><option value="mr">मराठी</option>
      </select>
      <div class="bg-slate-900 border border-amber-500/40 text-amber-300 px-3 py-1 rounded-xl font-mono font-bold">⏱️ <span id="tm">120:00</span></div>
    </div>
  </header>
  <div class="flex space-x-2 py-2 overflow-x-auto text-xs" id="st"></div>
  <main class="grid grid-cols-1 lg:grid-cols-4 gap-4 flex-1 my-2">
    <div class="lg:col-span-3 bg-slate-900 p-5 rounded-2xl flex flex-col justify-between border border-slate-800 shadow-xl">
      <div>
        <div class="flex justify-between text-xs text-slate-400 border-b border-slate-800 pb-2"><span id="sb" class="text-cyan-400 font-bold">Section</span><span id="qn">Q 1/100</span></div>
        <div id="qt" class="text-sm sm:text-base font-semibold py-4 text-white leading-relaxed">Paper loading...</div>
        <div id="qo" class="space-y-2"></div>
      </div>
      <div class="flex justify-between pt-4 border-t border-slate-800 text-xs">
        <button onclick="clr()" class="px-3 py-1.5 border border-slate-700 text-slate-400 rounded-lg">Clear</button>
        <div class="space-x-2"><button onclick="prev()" class="px-4 py-1.5 bg-slate-800 text-white rounded-lg">← Prev</button><button onclick="next()" class="px-5 py-1.5 bg-emerald-500 text-slate-950 font-black rounded-lg">Save & Next →</button></div>
      </div>
    </div>
    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col justify-between shadow-xl">
      <div class="text-xs font-bold border-b border-slate-800 pb-2 text-slate-300">Question Palette (100 Qs)</div>
      <div id="pg" class="grid grid-cols-5 gap-1.5 max-h-[300px] overflow-y-auto pr-1"></div>
      <button onclick="sub()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl text-xs mt-3">SUBMIT TEST</button>
    </div>
  </main>
  <script>
    let qs=[],cur=0,ans={},tl=7200,lng="hi";
    const pN = new URLSearchParams(location.search).get("paper") || new URLSearchParams(location.search).get("shift") || "paper1";
    const pN = new URLSearchParams(location.search).get("paper") || new URLSearchParams(location.search).get("shift") || "paper1";
    fetch("./data/" + pN + ".json")
      .then(r => { if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(d => { qs = d; init(); })
      .catch(err => {
        fetch("./data/shift1.json")
          .then(r => { if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
          .then(d => { qs = d; init(); })
          .catch(e => {
            document.getElementById("qt").innerHTML = "<div class='p-4 bg-rose-950/80 border border-rose-500 rounded-xl text-rose-200 text-xs font-mono font-bold'>" +
              "⚠️ Server Error: " + e.message + " on ./data/" + pN + ".json.<br>Kripya 1 minute baad refresh karein (GitHub CDN Syncing)." +
            "</div>";
          });
      });});
    function init(){renderSec();loadQ(0);renderPal();setInterval(()=>{if(tl>0){tl--;document.getElementById("tm").innerText=String(Math.floor(tl/60)).padStart(2,"0")+":"+String(tl%60).padStart(2,"0");}},1000);}
    function renderSec(){const s=[...new Set(qs.map(q=>q.sec))];document.getElementById("st").innerHTML=s.map(x=>'<button onclick="jump(''+x+'')" class="px-3 py-1 bg-slate-800 text-slate-300 rounded-lg font-bold">'+x+'</button>').join("");}
    window.jump=function(s){const i=qs.findIndex(q=>q.sec===s);if(i!==-1)loadQ(i);};
    function loadQ(i){cur=i;const q=qs[i];document.getElementById("sb").innerText=q.sec;document.getElementById("qn").innerText="Q "+(i+1)+"/"+qs.length;
    let t=typeof q.q==="object"?(q.q[lng]||q.q.hi||q.q.en||q.q.mr):q.q;document.getElementById("qt").innerText=t;
    document.getElementById("qo").innerHTML=(q.o||[]).map((o,idx)=>'<label class="flex items-center space-x-3 p-3 rounded-xl border '+(ans[i]===idx?"border-amber-500 bg-amber-950/40":"border-slate-800 bg-slate-950")+' cursor-pointer text-xs"><input type="radio" name="opt" '+(ans[i]===idx?"checked":"")+' onchange="sel('+i+','+idx+')" class="accent-amber-500"><span class="font-bold text-slate-400">'+String.fromCharCode(65+idx)+'.</span><span class="text-slate-200">'+o+'</span></label>').join("");renderPal();}
    window.sel=function(i,idx){ans[i]=idx;loadQ(i);};window.clr=function(){delete ans[cur];loadQ(cur);};window.prev=function(){if(cur>0)loadQ(cur-1);};window.next=function(){if(cur<qs.length-1)loadQ(cur+1);};window.chLang=function(l){lng=l;loadQ(cur);};
    function renderPal(){document.getElementById("pg").innerHTML=qs.map((q,i)=>'<button onclick="loadQ('+i+')" class="h-7 rounded text-[11px] font-mono '+(ans.hasOwnProperty(i)?"bg-emerald-500 text-slate-950 font-bold":(i===cur?"ring-2 ring-amber-400 bg-slate-700 text-white":"bg-slate-800 text-slate-400"))+'">'+(i+1)+'</button>').join("");}
    window.sub=function(){let c=0,w=0;qs.forEach((q,i)=>{if(ans.hasOwnProperty(i)){if(ans[i]===q.a)c++;else w++;}});
    const sc=((c*1)-(w*0.33)).toFixed(2);
    document.body.innerHTML='<div class="min-h-screen bg-slate-950 text-white p-6 flex items-center justify-center"><div class="max-w-md w-full bg-slate-900 border border-slate-800 p-6 rounded-3xl text-center space-y-4 shadow-2xl"><h2 class="text-base font-bold">BPSC (Bihar PCS) Scorecard</h2><div class="text-3xl font-mono font-black text-amber-400">'+sc+' / 100</div><div class="grid grid-cols-3 gap-2 text-xs font-mono"><div class="p-2 bg-emerald-950 text-emerald-300 rounded">✓ '+c+' Right</div><div class="p-2 bg-rose-950 text-rose-300 rounded">✕ '+w+' Wrong</div><div class="p-2 bg-slate-800 text-slate-400">- '+(qs.length-c-w)+' Skip</div></div><a href="index.html" class="inline-block mt-4 px-6 py-2 bg-amber-500 text-slate-950 font-bold rounded-xl text-xs">← Return to Vault</a></div></div>';};
  </script>
</body></html>
