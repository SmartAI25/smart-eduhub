<!DOCTYPE html><html><head><meta charset="UTF-8"><title>UPSC GS-1 Mock Paper</title><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1891031290159418" crossorigin="anonymous"></script><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-slate-100 min-h-screen p-4 font-sans select-none"><header class="flex justify-between items-center pb-3 border-b border-slate-800"><a href="index.html" class="text-rose-400 text-xs font-bold">✕ Exit</a><div class="text-xs font-bold text-purple-400">⏱️ <span id="clock">120:00</span></div></header><main class="max-w-2xl mx-auto py-6"><div id="box" class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl"><div class="text-xs text-purple-400 font-mono mb-2" id="qnum">Q1</div><h2 id="qtxt" class="text-base font-bold text-white mb-4">...</h2><div id="opts" class="space-y-2 mb-4"></div><div id="exp" class="hidden p-3 rounded-xl text-xs bg-slate-950 border border-slate-800 mb-4"></div><div class="flex justify-between items-center pt-3 border-t border-slate-800"><button id="pbtn" onclick="prev()" class="px-3 py-1.5 bg-slate-800 rounded-lg text-xs">Prev</button><button id="nbtn" onclick="next()" class="px-4 py-1.5 bg-purple-500 text-slate-950 font-bold rounded-lg text-xs">Save & Next →</button></div></div></main><script>
const qs=[{q:"Which feature indicates Indian polity is federal in character?",o:["Independence of judiciary is safeguarded","Union Legislature has elected state reps","Cabinet has regional parties","Fundamental rights are enforceable"],a:0,e:"An independent judiciary is an essential federal feature to arbitrate Centre-State disputes."},{q:"Which National Park has climate varying from tropical to arctic?",o:["Khangchendzonga","Nanda Devi","Neora Valley","Namdapha"],a:3,e:"Namdapha National Park in Arunachal Pradesh ranges from 200m to 4,500m elevation."}];
let cur=0,rev=false,sel=Array(qs.length).fill(null),time=7200;
setInterval(()=>{if(time>0&&!rev){time--;let m=Math.floor(time/60),s=time%60;document.getElementById("clock").innerText=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}},1000);
function draw(){const q=qs[cur];document.getElementById("qnum").innerText="Question "+(cur+1)+" of "+qs.length;document.getElementById("qtxt").innerText=q.q;document.getElementById("opts").innerHTML=q.o.map((opt,i)=>"<div onclick="pick("+i+")" class="p-3 rounded-xl border text-xs cursor-pointer "+(rev?(i===q.a?"border-emerald-500 bg-emerald-950/40 text-emerald-300 font-bold":(sel[cur]===i?"border-rose-500 bg-rose-950/40 text-rose-300":"border-slate-800")):sel[cur]===i?"border-purple-500 bg-purple-950/40 text-purple-300 font-bold":"border-slate-800 bg-slate-950")+"">"+String.fromCharCode(65+i)+". "+opt+"</div>").join("");const ex=document.getElementById("exp");if(rev){ex.className="p-3 rounded-xl text-xs bg-slate-950 border border-slate-800 text-slate-300 mb-4 block";ex.innerHTML="<b>💡 Analytical Note:</b> "+q.e;}else ex.className="hidden";document.getElementById("pbtn").disabled=cur===0;document.getElementById("nbtn").innerText=cur===qs.length-1&&!rev?"Submit Test ✓":(rev?"Next →":"Save & Next →");}
window.pick=i=>{if(!rev){sel[cur]=i;draw();}};window.prev=()=>{if(cur>0){cur--;draw();}};window.next=()=>{if(cur===qs.length-1&&!rev){rev=true;cur=0;alert("Test Completed! Solutions unlocked.");draw();return;}if(cur<qs.length-1)cur++;draw();};draw();
</script></body></html>
