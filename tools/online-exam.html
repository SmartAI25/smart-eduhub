<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>CBT Exam Simulator - SmartEduHub</title><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1891031290159418" crossorigin="anonymous"></script><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none"><header class="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-50 flex justify-between items-center"><div class="flex items-center space-x-3"><a href="../index.html" class="text-emerald-400 font-bold text-sm">← Exit</a><span class="text-slate-600">|</span><span class="font-extrabold text-sm sm:text-base text-white">🏛️ CBT Exam Simulator</span></div><div class="flex items-center space-x-3"><div class="bg-slate-950 border border-slate-700 px-2 py-1 rounded text-xs flex items-center space-x-1"><span class="text-slate-400">🌐</span><select id="lang" class="bg-transparent text-emerald-400 font-bold focus:outline-none"><option value="en" class="bg-slate-900 text-white">English</option><option value="hi" class="bg-slate-900 text-white">हिन्दी</option></select></div><div class="bg-emerald-950/70 border border-emerald-500/50 px-3 py-1 rounded text-emerald-300 font-mono text-sm font-bold">⏱️ <span id="clock">15:00</span></div></div></header><main class="max-w-7xl mx-auto p-4 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-6"><div class="lg:col-span-3 bg-slate-900/90 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between shadow-xl"><div><div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4"><span id="q-num" class="text-xs font-bold px-3 py-1 bg-cyan-500/20 text-cyan-400 rounded-full">Question 1</span><span class="text-xs text-emerald-400 font-mono font-semibold">+2.00 / -0.50</span></div><h2 id="q-txt" class="text-base sm:text-lg font-bold text-white mb-6">Loading...</h2><div id="opts" class="space-y-3"></div></div><div class="border-t border-slate-800 pt-5 mt-6 flex flex-wrap justify-between gap-3"><div class="flex space-x-2"><button onclick="markReview()" class="px-3 py-2 bg-purple-900/50 border border-purple-500/50 text-purple-300 rounded-xl text-xs font-semibold">🔖 Review</button><button onclick="clearOpt()" class="px-3 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs">Clear</button></div><div class="flex space-x-2"><button id="p-btn" onclick="prevQ()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs">← Prev</button><button onclick="saveNext()" class="px-5 py-2 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl text-xs">Save & Next →</button></div></div></div><div class="lg:col-span-1 bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-xl h-fit"><h3 class="text-xs font-bold uppercase text-slate-400 mb-3 tracking-wider">Question Palette</h3><div class="grid grid-cols-2 gap-2 text-[10px] text-slate-400 mb-4 pb-3 border-b border-slate-800"><div class="flex items-center space-x-1.5"><span class="w-2.5 h-2.5 rounded bg-emerald-500"></span><span>Answered</span></div><div class="flex items-center space-x-1.5"><span class="w-2.5 h-2.5 rounded bg-rose-500"></span><span>Not Answered</span></div><div class="flex items-center space-x-1.5"><span class="w-2.5 h-2.5 rounded bg-purple-500"></span><span>Review</span></div><div class="flex items-center space-x-1.5"><span class="w-2.5 h-2.5 rounded bg-slate-800 border border-slate-700"></span><span>Not Visited</span></div></div><div id="grid" class="grid grid-cols-5 gap-2 mb-6"></div><button onclick="finishPrompt()" class="w-full py-2.5 bg-gradient-to-r from-cyan-500 to-emerald-500 text-slate-950 font-black rounded-xl text-xs uppercase tracking-wider">Submit Exam</button></div></main><div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4"><div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 text-center space-y-4"><div class="text-4xl">📊</div><h2 class="text-xl font-black text-white">Scorecard & Result</h2><div class="grid grid-cols-2 gap-3 bg-slate-950 p-4 rounded-xl text-xs"><div><div class="text-slate-400">Final Score</div><div id="m-score" class="text-lg font-bold text-emerald-400">0.00 / 10</div></div><div><div class="text-slate-400">Accuracy</div><div id="m-acc" class="text-lg font-bold text-cyan-400">0%</div></div><div><div class="text-slate-400">Correct</div><div id="m-cor" class="text-sm font-bold text-emerald-400">0</div></div><div><div class="text-slate-400">Incorrect</div><div id="m-inc" class="text-sm font-bold text-rose-400">0</div></div></div><button onclick="location.reload()" class="w-full py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs">Retest</button></div></div><script>
const qs = [{"en":{"q":"Which Amendment added 'Fundamental Duties' to Constitution?","o":["42nd (1976)","44th (1978)","73rd (1992)","86th (2002)"]},"hi":{"q":"संविधान में 'मौलिक कर्तव्य' किस संशोधन द्वारा जोड़े गए?","o":["42वां (1976)","44वां (1978)","73वां (1992)","86वां (2002)"]},"ans":0},{"en":{"q":"Who presided over 1929 Lahore Session (Purna Swaraj)?","o":["Mahatma Gandhi","Jawaharlal Nehru","Subhash Bose","Sardar Patel"]},"hi":{"q":"1929 लाहौर अधिवेशन (पूर्ण स्वराज) के अध्यक्ष कौन थे?","o":["महात्मा गांधी","जवाहरलाल नेहरू","सुभाष बोस","सरदार पटेल"]},"ans":1},{"en":{"q":"Primary objective of RBI Open Market Operations (OMO)?","o":["Export Control","Banking Liquidity Management","Stock Market","Gold Reserve"]},"hi":{"q":"RBI के खुला बाजार परिचालन (OMO) का मुख्य उद्देश्य?","o":["निर्यात नियंत्रण","बैंकिंग तरलता संतुलन","शेयर बाजार","स्वर्ण भंडार"]},"ans":1},{"en":{"q":"Sold at ₹1440 at 10% loss. Selling price for 15% profit?","o":["₹ 1,720","₹ 1,840","₹ 1,680","₹ 1,900"]},"hi":{"q":"वस्तु ₹1440 में 10% हानि पर बिकी। 15% लाभ हेतु विक्रय मूल्य?","o":["₹ 1,720","₹ 1,840","₹ 1,680","₹ 1,900"]},"ans":1},{"en":{"q":"Sum doubles in 5 yrs at SI. When will it become 4 times?","o":["10 Years","12 Years","15 Years","20 Years"]},"hi":{"q":"साधारण ब्याज से कोई धन 5 वर्ष में दोगुना। 4 गुना कब होगा?","o":["10 वर्ष","12 वर्ष","15 वर्ष","20 वर्ष"]},"ans":2}];
let cur = 0, lang = "en", time = 900;
const states = qs.map(() => ({ sel: null, st: 'unvisited' }));
states[0].st = 'not-answered';
setInterval(() => { if (time > 0) time--; const m = Math.floor(time / 60), s = time % 60; document.getElementById("clock").innerText = String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0'); if (time === 0) finish(); }, 1000);
function draw() { const q = qs[cur][lang], st = states[cur]; if (st.st === 'unvisited') st.st = 'not-answered'; document.getElementById("q-num").innerText = "Question " + (cur + 1); document.getElementById("q-txt").innerText = q.q; document.getElementById("opts").innerHTML = q.o.map((o, i) => '<div onclick="pick(' + i + ')" class="p-3.5 rounded-xl border cursor-pointer transition text-xs sm:text-sm ' + (st.sel === i ? 'border-emerald-500 bg-emerald-950/40 text-emerald-300 font-semibold' : 'border-slate-800 bg-slate-950/60 hover:border-slate-700') + '"><span class="font-mono text-slate-500 mr-2">' + String.fromCharCode(65+i) + '.</span> ' + o + '</div>').join(""); document.getElementById("p-btn").disabled = cur === 0; drawGrid(); }
function drawGrid() { document.getElementById("grid").innerHTML = states.map((s, i) => { let cls = "bg-slate-800 text-slate-400 border border-slate-700"; if (s.st === 'answered') cls = "bg-emerald-500 text-slate-950 font-bold"; else if (s.st === 'not-answered') cls = "bg-rose-500 text-white font-bold"; else if (s.st === 'review') cls = "bg-purple-600 text-white font-bold"; const ring = cur === i ? "ring-2 ring-cyan-400" : ""; return '<button onclick="jump(' + i + ')" class="h-8 rounded flex items-center justify-center text-xs font-mono ' + cls + ' ' + ring + '">' + (i+1) + '</button>'; }).join(""); }
window.pick = (i) => { states[cur].sel = i; draw(); };
window.clearOpt = () => { states[cur].sel = null; states[cur].st = 'not-answered'; draw(); };
window.markReview = () => { states[cur].st = 'review'; if (cur < qs.length - 1) cur++; draw(); };
window.saveNext = () => { states[cur].st = states[cur].sel !== null ? 'answered' : 'not-answered'; if (cur < qs.length - 1) cur++; draw(); };
window.prevQ = () => { if (cur > 0) cur--; draw(); };
window.jump = (i) => { cur = i; draw(); };
window.finishPrompt = () => { if (confirm("Submit Exam?")) finish(); };
function finish() { let c = 0, inc = 0; qs.forEach((q, i) => { if (states[i].sel === q.ans) c++; else if (states[i].sel !== null) inc++; }); const score = (c * 2) - (inc * 0.5); const acc = (c + inc) > 0 ? Math.round((c / (c + inc)) * 100) : 0; document.getElementById("m-score").innerText = score.toFixed(2) + " / " + (qs.length * 2); document.getElementById("m-acc").innerText = acc + "%"; document.getElementById("m-cor").innerText = c; document.getElementById("m-inc").innerText = inc; document.getElementById("modal").classList.remove("hidden"); }
document.getElementById("lang").addEventListener("change", (e) => { lang = e.target.value; draw(); });
draw();
</script></body></html>
