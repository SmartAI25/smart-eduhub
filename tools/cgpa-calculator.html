<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGPA to Percentage Calculator - SmartEduHub</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1891031290159418" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-3xl mx-auto py-4">
    <a href="../index.html" class="text-emerald-400 text-sm hover:underline font-medium">← Back to EduHub Tools</a>
    <h1 class="text-3xl font-extrabold my-4 text-white">📊 CGPA to Percentage Calculator</h1>
    <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-6 space-y-5">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Select University / Board Formula</label>
        <select id="board" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-emerald-400 font-medium">
          <option value="cbse">CBSE Class 10/12 (Formula: CGPA × 9.5)</option>
          <option value="mu">Mumbai University Engineering (Formula: CGPA × 7.1 + 11)</option>
          <option value="vtu">VTU 10-Point Scale (Formula: (CGPA - 0.75) × 10)</option>
          <option value="standard">Standard Direct Scale (Formula: CGPA × 10)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Enter Your CGPA / SGPA (0.00 - 10.00)</label>
        <input type="number" id="cgpa" step="0.01" min="0" max="10" value="8.5" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-cyan-400 font-mono text-lg">
      </div>
      <div class="bg-slate-950 border border-slate-700 rounded-xl p-6 text-center">
        <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">Equivalent Percentage</div>
        <div id="pct" class="text-4xl font-black text-emerald-400">80.75%</div>
        <div id="ruleText" class="text-xs text-slate-500 mt-2 font-mono">Formula: 8.5 × 9.5</div>
      </div>
    </div>
  </div>
  <script>
    function calculate() {
      const b = document.getElementById("board").value;
      const val = parseFloat(document.getElementById("cgpa").value) || 0;
      let pct = 0; let formula = "";
      if (b === "cbse") { pct = val * 9.5; formula = val + " × 9.5"; }
      else if (b === "mu") { pct = (val * 7.1) + 11; formula = "(" + val + " × 7.1) + 11"; }
      else if (b === "vtu") { pct = val >= 0.75 ? (val - 0.75) * 10 : 0; formula = "(" + val + " - 0.75) × 10"; }
      else { pct = val * 10; formula = val + " × 10"; }
      if (pct > 100) pct = 100; if (pct < 0) pct = 0;
      document.getElementById("pct").innerText = pct.toFixed(2) + "%";
      document.getElementById("ruleText").innerText = "Applied Formula: " + formula;
    }
    document.getElementById("board").addEventListener("change", calculate);
    document.getElementById("cgpa").addEventListener("input", calculate);
    calculate();
  </script>
</body>
</html>
