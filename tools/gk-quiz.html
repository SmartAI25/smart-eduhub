<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily GK & Exam Mock Quiz - SmartEduHub</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1891031290159418" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 sm:p-6 font-sans">
  <!-- Sleek Compact Box (Same as Exam Hall) -->
  <div class="max-w-2xl mx-auto py-2">
    <!-- Header with Back & Language Switcher -->
    <div class="flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
      <a href="../index.html" class="text-emerald-400 text-xs sm:text-sm font-semibold hover:underline">← Exit Quiz</a>
      
      <div class="flex items-center space-x-2">
        <div class="bg-slate-900 border border-slate-700 px-2 py-1 rounded text-xs flex items-center space-x-1">
          <span class="text-slate-400">🌐</span>
          <select id="quiz-lang" class="bg-transparent text-emerald-400 font-bold focus:outline-none cursor-pointer">
            <option value="en" class="bg-slate-900 text-white">English</option>
            <option value="hi" class="bg-slate-900 text-white">हिन्दी</option>
          </select>
        </div>
        <div class="text-xs bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-lg">
          Score: <span id="score" class="font-bold text-emerald-400">0</span>/<span id="total">0</span>
        </div>
      </div>
    </div>

    <!-- 30s Countdown Bar -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-xl px-3 py-2 mb-3 flex items-center justify-between">
      <div class="text-xs font-semibold text-slate-300">⏱️ <span id="timer-text" class="text-emerald-400 font-mono font-bold">30s</span></div>
      <div class="w-1/2 bg-slate-950 h-2 rounded-full overflow-hidden border border-slate-800">
        <div id="timer-bar" class="bg-emerald-400 h-full w-full transition-all duration-1000 ease-linear"></div>
      </div>
    </div>

    <!-- Compact Question Card -->
    <div id="quiz-box" class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-2xl">
      <div class="flex justify-between items-center mb-3">
        <span id="badge" class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full">GK</span>
        <span id="q-counter" class="text-xs text-slate-400 font-mono">1 of 5</span>
      </div>

      <h2 id="question" class="text-sm sm:text-base font-bold text-white mb-4 leading-relaxed">Loading question...</h2>
      <div id="options" class="space-y-2 mb-4"></div>
      <div id="exp-box" class="hidden p-3 rounded-xl text-xs border bg-slate-950 border-slate-800 leading-relaxed"></div>

      <div class="flex justify-between items-center mt-5 pt-3 border-t border-slate-800">
        <button onclick="restartQuiz()" class="text-xs text-slate-400 hover:text-white transition">↺ New Questions</button>
        <button id="next-btn" onclick="nextQuestion()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl text-xs transition disabled:opacity-40">Next →</button>
      </div>
    </div>
  </div>

  <script>
    // Pool of Bilingual Questions (Randomly picked 5 on every reload)
    const questionBank = [
      {
        sub: "Polity",
        en: { q: "Under which Article of the Constitution can Fundamental Rights be enforced via Supreme Court writs?", opts: ["Article 21", "Article 32", "Article 226", "Article 368"], exp: "Article 32 gives the Right to Constitutional Remedies, called the heart and soul of Constitution." },
        hi: { q: "संविधान के किस अनुच्छेद के तहत मौलिक अधिकारों को लागू करने के लिए सुप्रीम कोर्ट में रिट याचिका दायर की जाती है?", opts: ["अनुच्छेद 21", "अनुच्छेद 32", "अनुच्छेद 226", "अनुच्छेद 368"], exp: "अनुच्छेद 32 को डॉ. अम्बेडकर ने संविधान का 'हृदय और आत्मा' कहा था।" },
        ans: 1
      },
      {
        sub: "History",
        en: { q: "Who was the Viceroy of India when the Indian National Congress was founded in 1885?", opts: ["Lord Ripon", "Lord Curzon", "Lord Dufferin", "Lord Dalhousie"], exp: "INC was founded in Dec 1885 under the viceroyalty of Lord Dufferin." },
        hi: { q: "1885 में भारतीय राष्ट्रीय कांग्रेस की स्थापना के समय भारत का वायसराय कौन था?", opts: ["लॉर्ड रिपन", "लॉर्ड कर्जन", "लॉर्ड डफरिन", "लॉर्ड डलहौजी"], exp: "कांग्रेस की स्थापना 1885 में लॉर्ड डफरिन के कार्यकाल में हुई थी।" },
        ans: 2
      },
      {
        sub: "Science",
        en: { q: "Which hormone is called the 'Emergency Hormone' or Fight-or-Flight hormone?", opts: ["Insulin", "Adrenaline", "Thyroxine", "Glucagon"], exp: "Adrenaline, secreted by adrenal gland, prepares the body for sudden stress." },
        hi: { q: "किस हार्मोन को 'आपातकालीन हार्मोन' (Emergency Hormone) कहा जाता है?", opts: ["इंसुलिन", "एड्रेनालाईन", "थायरोक्सिन", "ग्लूकागन"], exp: "एड्रेनालाईन तनाव की स्थिति में हृदय गति और ऊर्जा तुरंत बढ़ा देता है।" },
        ans: 1
      },
      {
        sub: "Geography",
        en: { q: "Which strait separates India from Sri Lanka?", opts: ["Malacca Strait", "Palk Strait", "Sunda Strait", "Hormuz Strait"], exp: "Palk Strait connects the Bay of Bengal with the Gulf of Mannar." },
        hi: { q: "भारत को श्रीलंका से कौन सी जलसंधि अलग करती है?", opts: ["मलक्का जलसंधि", "पाक जलडमरूमध्य (Palk Strait)", "सुंडा जलसंधि", "होर्मुज जलसंधि"], exp: "पाक जलडमरूमध्य तमिलनाडु और श्रीलंका के बीच स्थित है।" },
        ans: 1
      },
      {
        sub: "Economy",
        en: { q: "Which institution publishes the 'Financial Stability Report' (FSR) in India?", opts: ["NITI Aayog", "Ministry of Finance", "Reserve Bank of India (RBI)", "SEBI"], exp: "The FSR is published biannually by the RBI." },
        hi: { q: "भारत में 'वित्तीय स्थिरता रिपोर्ट' (FSR) कौन सी संस्था प्रकाशित करती है?", opts: ["नीति आयोग", "वित्त मंत्रालय", "भारतीय रिज़र्व बैंक (RBI)", "सेबी (SEBI)"], exp: "RBI साल में दो बार वित्तीय स्थिरता रिपोर्ट जारी करता है।" },
        ans: 2
      },
      {
        sub: "Ecology",
        en: { q: "The Ramsar Convention (1971) is dedicated to the conservation of:", opts: ["Coral Reefs", "Wetlands", "Rainforests", "Mangroves"], exp: "Ramsar Convention is an international treaty for wetland preservation." },
        hi: { q: "रामसर सम्मेलन (1971) किसके संरक्षण के लिए समर्पित है?", opts: ["कोरल रीफ", "आर्द्रभूमि (Wetlands)", "वर्षावन", "मैंग्रोव"], exp: "रामसर समझौता आर्द्रभूमियों (Wetlands) के संरक्षण के लिए हुआ था।" },
        ans: 1
      },
      {
        sub: "Polity",
        en: { q: "Which part of the Constitution deals with the Panchayati Raj System?", opts: ["Part IX", "Part IV", "Part XI", "Part XIV"], exp: "Part IX was added by the 73rd Constitutional Amendment Act, 1992." },
        hi: { q: "संविधान का कौन सा भाग 'पंचायती राज व्यवस्था' से संबंधित है?", opts: ["भाग IX", "भाग IV", "भाग XI", "भाग XIV"], exp: "73वें संविधान संशोधन 1992 द्वारा भाग IX और 11वीं अनुसूची जोड़ी गई थी।" },
        ans: 0
      },
      {
        sub: "General Science",
        en: { q: "What is the chemical name of Vitamin C?", opts: ["Citric Acid", "Ascorbic Acid", "Tartaric Acid", "Lactic Acid"], exp: "Ascorbic acid is the chemical name of Vitamin C, deficiency causes Scurvy." },
        hi: { q: "विटामिन C का रासायनिक नाम क्या है?", opts: ["साइट्रिक एसिड", "एस्कॉर्बिक एसिड", "टार्टरिक एसिड", "लैक्टिक एसिड"], exp: "विटामिन C का नाम एस्कॉर्बिक एसिड है, इसकी कमी से स्कर्वी रोग होता है।" },
        ans: 1
      }
    ];

    let currentQuestions = [];
    let curIdx = 0, score = 0, answered = false;
    let currentLang = "en";
    let timeLeft = 30, timer = null;

    // Pick 5 random questions every time
    function initRandomQuestions() {
      currentQuestions = [...questionBank].sort(() => 0.5 - Math.random()).slice(0, 5);
      curIdx = 0;
      score = 0;
      document.getElementById("score").innerText = "0";
      document.getElementById("total").innerText = "0";
      loadQ();
    }

    function startTimer() {
      clearInterval(timer);
      timeLeft = 30;
      updTimer();
      timer = setInterval(() => {
        timeLeft--;
        updTimer();
        if (timeLeft <= 0) {
          clearInterval(timer);
          if (!answered) handleTimeOut();
        }
      }, 1000);
    }

    function updTimer() {
      const t = document.getElementById("timer-text");
      const b = document.getElementById("timer-bar");
      t.innerText = timeLeft + "s";
      b.style.width = (timeLeft / 30 * 100) + "%";
      if (timeLeft <= 7) {
        t.className = "text-rose-400 font-mono font-bold animate-pulse";
        b.className = "bg-rose-500 h-full transition-all duration-1000";
      } else {
        t.className = "text-emerald-400 font-mono font-bold";
        b.className = "bg-emerald-400 h-full transition-all duration-1000";
      }
    }

    function loadQ() {
      answered = false;
      const qData = currentQuestions[curIdx];
      const qObj = qData[currentLang];

      document.getElementById("badge").innerText = qData.sub;
      document.getElementById("q-counter").innerText = (curIdx + 1) + " of " + currentQuestions.length;
      document.getElementById("question").innerText = qObj.q;

      const exp = document.getElementById("exp-box");
      exp.className = "hidden";
      exp.innerHTML = "";

      document.getElementById("options").innerHTML = qObj.opts.map((opt, i) => `
        <button onclick="choose(${i})" class="opt-btn w-full text-left p-3 rounded-xl border border-slate-800 bg-slate-950/60 hover:border-slate-700 transition text-xs sm:text-sm flex justify-between items-center">
          <span><span class="font-mono text-slate-500 mr-2">${String.fromCharCode(65 + i)}.</span> ${opt}</span>
          <span class="ind font-bold"></span>
        </button>
      `).join("");

      document.getElementById("next-btn").disabled = true;
      startTimer();
    }

    window.choose = function(selected) {
      if (answered) return;
      answered = true;
      clearInterval(timer);
      const qData = currentQuestions[curIdx];
      const qObj = qData[currentLang];
      const btns = document.querySelectorAll(".opt-btn");

      btns.forEach((b, i) => {
        b.disabled = true;
        if (i === qData.ans) {
          b.classList.add("border-emerald-500", "bg-emerald-950/40", "text-emerald-300");
          b.querySelector(".ind").innerText = "✓";
        } else if (i === selected) {
          b.classList.add("border-rose-500", "bg-rose-950/40", "text-rose-300");
          b.querySelector(".ind").innerText = "✕";
        }
      });

      if (selected === qData.ans) score++;
      document.getElementById("score").innerText = score;
      document.getElementById("total").innerText = (curIdx + 1);

      const exp = document.getElementById("exp-box");
      exp.className = "p-3 rounded-xl text-xs border bg-slate-950 border-slate-800 text-slate-300 mt-3 block";
      exp.innerHTML = '<span class="font-bold text-emerald-400">💡 ' + (currentLang === "hi" ? "व्याख्या:" : "Explanation:") + '</span> ' + qObj.exp;

      document.getElementById("next-btn").disabled = false;
    };

    function handleTimeOut() {
      answered = true;
      const qData = currentQuestions[curIdx];
      const btns = document.querySelectorAll(".opt-btn");
      btns.forEach((b, i) => {
        b.disabled = true;
        if (i === qData.ans) b.classList.add("border-emerald-500", "bg-emerald-950/40", "text-emerald-300");
      });
      document.getElementById("total").innerText = (curIdx + 1);
      const exp = document.getElementById("exp-box");
      exp.className = "p-3 rounded-xl text-xs border bg-rose-950/40 border-rose-800 text-rose-200 mt-3 block";
      exp.innerHTML = '⏱️ ' + (currentLang === "hi" ? "समय समाप्त! सही उत्तर हरा है।" : "Time Expired!");
      document.getElementById("next-btn").disabled = false;
    }

    window.nextQuestion = function() {
      if (curIdx < currentQuestions.length - 1) {
        curIdx++;
        loadQ();
      } else {
        clearInterval(timer);
        document.getElementById("quiz-box").innerHTML = `
          <div class="text-center py-6 space-y-3">
            <div class="text-4xl">🏆</div>
            <h3 class="text-lg font-bold text-white">${currentLang === "hi" ? "क्विज़ संपन्न!" : "Quiz Completed!"}</h3>
            <div class="text-sm text-slate-300">Score: <span class="text-emerald-400 font-bold">${score}</span> / ${currentQuestions.length}</div>
            <button onclick="initRandomQuestions()" class="mt-2 px-5 py-2 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl text-xs transition">${currentLang === "hi" ? "नए सवाल खेलें (Play New)" : "Play New Quiz"}</button>
          </div>
        `;
      }
    };

    window.restartQuiz = function() {
      initRandomQuestions();
    };

    document.getElementById("quiz-lang").addEventListener("change", (e) => {
      currentLang = e.target.value;
      loadQ();
    });

    initRandomQuestions();
  </script>
</body>
</html>
